name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove -SNAPSHOT from version
        id: release_version
        run: |
          CURRENT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
      
          if [ "$CURRENT_VERSION" == "$RELEASE_VERSION" ]; then
            echo "La versión en main no tiene -SNAPSHOT, no hay nada que release. Abortando."
            exit 1
          fi
      
          mvn -q versions:set -DnewVersion=$RELEASE_VERSION -DgenerateBackupPoms=false
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B clean package

      - name: Commit release version and tag
        run: |
          git add pom.xml
          git commit -m "chore(release): v${{ steps.release_version.outputs.version }}"
          git tag v${{ steps.release_version.outputs.version }}
          git push origin main
          git push origin v${{ steps.release_version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          generate_release_notes: true
          files: target/*.jar

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Bump develop to next SNAPSHOT
        run: |
          NEXT_VERSION=$(echo ${{ steps.release_version.outputs.version }} | \
            awk -F. -v OFS=. '{ $NF += 1 ; print }')
      
          mvn -q versions:set -DnewVersion=${NEXT_VERSION}-SNAPSHOT -DgenerateBackupPoms=false
      
          git add pom.xml
          git commit -m "chore: prepare next development version (${NEXT_VERSION}-SNAPSHOT)"
          git push origin develop
