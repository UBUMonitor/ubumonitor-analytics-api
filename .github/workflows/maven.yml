name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove -SNAPSHOT from version
        id: release_version
        run: |
          # -N: solo el pom raíz (si no, help:evaluate imprime una versión por módulo)
          CURRENT_VERSION=$(mvn -B -q -N -DforceStdout help:evaluate -Dexpression=project.version)
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}

          if [ "$CURRENT_VERSION" == "$RELEASE_VERSION" ]; then
            echo "La versión en main no tiene -SNAPSHOT, no hay nada que release. Abortando."
            exit 1
          fi

          # Actualiza el pom raíz, los módulos, sus <parent> y las dependencias entre módulos
          mvn -B -q versions:set \
            -DnewVersion=$RELEASE_VERSION \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Commit release version and tag
        run: |
          # Solo los pom.xml (el build puede reformatear otros ficheros con spotless)
          git add pom.xml '*/pom.xml'
          git commit -m "chore(release): v${{ steps.release_version.outputs.version }}"
          git tag v${{ steps.release_version.outputs.version }}
          git push origin main
          git push origin v${{ steps.release_version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          generate_release_notes: true
          files: ubumonitor-analytics/target/ubumonitoranalytics-${{ steps.release_version.outputs.version }}.jar

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge release commit into develop
        run: |
          git fetch origin main
          git merge origin/main --no-edit -X ours -m "chore(release): merge v${{ steps.release_version.outputs.version }} into develop"
          git push origin develop

      - name: Bump develop to next SNAPSHOT
        run: |
          NEXT_VERSION=$(echo "${{ steps.release_version.outputs.version }}" | \
            awk -F. -v OFS=. '{ $NF += 1 ; print }')

          mvn -B -q versions:set \
            -DnewVersion=${NEXT_VERSION}-SNAPSHOT \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

          git add pom.xml '*/pom.xml'
          git commit -m "chore: prepare next development version (${NEXT_VERSION}-SNAPSHOT)"
          git push origin develop
