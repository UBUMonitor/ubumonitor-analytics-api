get:
  tags:
    - Users
  summary: Get user profile image
  operationId: GetUserImagesProfile
  description: Get user profile image
  security: [ ]
  parameters:
    - name: If-None-Match
      in: header
      description: hash to check if has changes
      required: false
      schema:
        type: string
    - name: userId
      in: path
      description: The user id
      required: true
      schema:
        type: integer
    - name: host
      in: query
      description: The Moodle host
      required: true
      schema:
        type: string
        format: uri
    - name: username
      in: query
      description: The user name
      required: true
      schema:
        type: string

  responses:
    '200':
      description: Image of the user
      headers:
        ETag:
          schema:
            type: string
      content:
        image/jpeg:

          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/gif:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
        image/bmp:
          schema:
            type: string
            format: binary
        image/tiff:
          schema:
            type: string
            format: binary
    '304':
      description: Not Modified
