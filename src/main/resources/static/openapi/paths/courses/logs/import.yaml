post:
  tags:
    - CourseLogs
  operationId: ImportCourseLogs
  summary: Import Moodle logs CSV
  parameters:
    - name: courseId
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - logFile
          properties:
            logFile:
              type: string
              format: binary
  responses:
    '200':
      description: Import completed
      content:
        application/json:
          schema:
            title: ImportCourseLogsResponse
            type: object
            properties:
              saved:
                type: integer
                description: Number of logs imported
              ignored:
                type: integer
                description: Number of logs ignored (e.g. duplicates or don't have a mapper for component, event or origin)
              failed:
                type: integer
                description: Number of logs that failed to import due to errors

    '401':
      $ref: '../../../openapi.yaml#/components/responses/unauthorized_401'
