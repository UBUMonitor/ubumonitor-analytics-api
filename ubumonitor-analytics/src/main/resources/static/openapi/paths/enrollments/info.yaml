get:
  tags:
    - UserEnrollments
  summary: Get the current user's enrollments
  operationId: GetActualUserEnrollments
  description: Retrieves the current user's course enrollments from the local tenant database.
  responses:
    '200':
      description: Successful retrieval of enrollments. The response includes the updated enrollment information for the user's courses.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/enrollments/info/response.yaml#/EnrollmentsResponse'
    '401':
      $ref: '../../openapi.yaml#/components/responses/unauthorized_401'
