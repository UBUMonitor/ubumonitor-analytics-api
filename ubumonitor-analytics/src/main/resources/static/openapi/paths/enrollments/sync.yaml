post:
  tags:
    - UserEnrollments
  summary: Synchronize the current user's enrollments
  operationId: SyncUserEnrollments
  description: Retrieves the current user's latest course enrollments from Moodle and updates the local tenant database.
  responses:
    '200':
      description: Successful synchronization of enrollments. The response includes the updated enrollment information for the user's courses.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/enrollments/info/response.yaml#/EnrollmentsResponse'
    '401':
      $ref: '../../openapi.yaml#/components/responses/unauthorized_401'
