post:
  tags:
    - CourseGrades
  summary: Synchronize course grades
  operationId: SyncCourseGrades
  description: Retrieves the latest enrollment data for users in the specified course and updates the local tenant database.
  parameters:
    - $ref: '../../../components/parameters/courseId.yaml'
  responses:
    '200':
      description: Successful synchronization of grades. The response includes the updated enrollment information for the user's courses.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/courses/grades/info/response.yaml#/CourseGradeItemsResponse'
    '401':
      $ref: '../../../components/responses/unauthorized_401.yaml'


