get:
  tags:
    - CourseActivityCompletion
  summary: Get course activity completion information with filter
  operationId: GetCourseActivityCompletionValues
  description: Retrieves the activity completion information for a course.
  parameters:
    - name: courseId
      in: path
      description: The unique identifier of the course for which to retrieve activity completion information.
      required: true
      schema:
        type: integer
        format: int64

    - name: moduleIds
      in: query
      description: Course modules ids.
      required: true
      explode: false
      schema:
        type: array
        minItems: 0
        items:
          type: integer
          format: int64
    - name: userIds
      in: query
      description: Course user ids.
      required: true
      explode: false
      schema:
        type: array
        minItems: 0
        items:
          type: integer
          format: int64
  responses:
    '200':
      description: Get course activity completion information
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/courses/activitycompletion/info/response.yaml#/CourseActivityCompletionResponse'
    '401':
      $ref: '../../../openapi.yaml#/components/responses/unauthorized_401'
