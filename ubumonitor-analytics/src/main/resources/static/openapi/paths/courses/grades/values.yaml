get:
  tags:
    - CourseGrades
  operationId: GetCourseGradesValues
  summary: Get course grade values
  description: Get course grade values

  parameters:
    - name: courseId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Course identifier

    - name: gradeItemsIds
      in: query
      description: List of grade item identifiers to include in the grade value lookup.
      required: true
      explode: false
      schema:
        type: array
        minItems: 0
        items:
          type: integer
          format: int64

    - name: userIds
      in: query
      description: List of user IDs to filter the results. If provided, only the specified users will have their grades included in the response.
      required: true
      explode: false
      schema:
        type: array
        minItems: 0
        items:
          type: integer
          format: int64
  responses:
    "200":
      description: Grades retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/courses/grades/values/response.yaml#/CourseGradesValuesResponse'

    '401':
      $ref: '../../../openapi.yaml#/components/responses/unauthorized_401'
