post:
  tags:
    - CourseEnrollments
  summary: Synchronize course enrollments
  operationId: SyncCourseUsersEnrollments
  description: Retrieves the latest enrollment data for users in the specified course and updates the local tenant database.
  parameters:
    - name: courseId
      in: path
      description: The unique identifier of the course for which to synchronize enrollments.
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Successful synchronization of enrollments. The response includes the updated enrollment information for the user's courses.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/courses/enrollments/info/response.yaml#/CourseEnrollmentsResponse'
    '401':
      $ref: '../../../openapi.yaml#/components/responses/unauthorized_401'



