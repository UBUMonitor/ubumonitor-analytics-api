post:
  tags:
    - CourseContent
  summary: Synchronize course users has been enrolled information
  operationId: SyncCourseContent
  description: Synchronizes the enrollments of the logged user courses information. This endpoint retrieves the latest enrollment data for the courses the user is enrolled in and updates the local database accordingly. It ensures that the user's course enrollments are up-to-date with the Moodle site.
  parameters:
    - name: courseId
      in: path
      description: The unique identifier of the course for which to synchronize enrollments.
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Successful synchronization of enrollments. The response includes the updated enrollment information for the user's courses.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/courses/content/info/response.yaml#/CourseContentResponse'
    '401':
      $ref: '../../../openapi.yaml#/components/responses/unauthorized_401'



