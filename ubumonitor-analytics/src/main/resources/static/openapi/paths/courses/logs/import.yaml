post:
  tags:
    - CourseLogs
  operationId: ImportCourseLogs
  summary: Import Moodle logs CSV
  parameters:
    - $ref: '../../../components/parameters/courseId.yaml'
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - logFile
          properties:
            logFile:
              type: string
              format: binary
  responses:
    '200':
      description: Import completed
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/courses/logs/info/response.yaml#/CourseLogsResponse'

    '401':
      $ref: '../../../components/responses/unauthorized_401.yaml'
