post:
  tags:
    - CourseLogs
  operationId: searchCourseLogs
  summary: Get course logs with filters
  description: |
    Retrieves logs for a specific course with optional filtering by date range
    and selectable log columns.

  parameters:
    - $ref: '../../../components/parameters/courseId.yaml'


  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/courses/logs/list/request.yaml#/CourseLogsListRequest'
  responses:
    "200":
      description: Logs retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/courses/logs/list/response.yaml#/CourseLogsListResponse'

    '401':
      $ref: '../../../components/responses/unauthorized_401.yaml'
