get:
  tags:
    - CourseForums
  summary: Get course forums information
  operationId: GetCourseForumsInfo
  description: Retrieves the persisted forums, discussions, and posts for the specified course.
  parameters:
    - name: courseId
      in: path
      description: The unique identifier of the course for which to retrieve forum information.
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Successful retrieval of forum information. The response includes the forum information for the specified course.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/forums/info/response.yaml#/CourseForumsResponse'
    '401':
      $ref: '../../../openapi.yaml#/components/responses/unauthorized_401'
