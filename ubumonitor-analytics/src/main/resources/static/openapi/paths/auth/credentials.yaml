post:
  tags: [ Auth ]
  operationId: AuthLogin
  summary: Authenticate with Moodle credentials
  description: |
    Receives a Moodle site URL, username, password, and database encryption key. Returns an opaque Bearer session token for subsequent authenticated requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/login/request.yaml#/AuthLoginRequest'

  security: [ ]
  responses:
    '200':
      description: Session token retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/auth/response.yaml#/AuthResponse"
    '401':
      $ref: '../../openapi.yaml#/components/responses/unauthorized_401'
