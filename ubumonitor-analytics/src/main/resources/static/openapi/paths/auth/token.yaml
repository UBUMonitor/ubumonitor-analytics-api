post:
  tags: [ Auth ]
  operationId: AuthToken
  summary: Authenticate with a Moodle token
  description: |
    Receives a Moodle site URL, an existing Moodle web-service token, and the database encryption key. Returns an application JWT for subsequent authenticated requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/token/request.yaml#/AuthTokenRequest'

  security: [ ]
  responses:
    '200':
      description: JWT token retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/auth/response.yaml#/AuthResponse"
    '401':
      $ref: '../../openapi.yaml#/components/responses/unauthorized_401'
