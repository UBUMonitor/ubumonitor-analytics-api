AuthSSORequest:
  type: object
  required:
    - host
    - moodleLaunchCredential
    - dbPassword
    - cookies
  properties:
    host:
      type: string
      format: uri
      description: Moodle site URL
      example: https://school.moodledemo.net
    moodleLaunchCredential:
      type: string
      description: Moodle launch credential from SSO
      example: moodlemobile://token=YTVkZDliM2I5MGZhMzllOGVhOWFkMzJiZTU4NjE5NzI6Ojo2MmNlMDg2ZmI2ZjE3YmZkODcwMDExZGFhN2Q3Nzc4Nw==
    dbPassword:
      type: string
      format: password
      description: Secret key used to encrypt the database using AES-256. This value must be kept securely and must not be stored or exposed in plain text.
      example: my-secure-encryption-key
    cookies:
      type: array
      description: Cookies from SSO request, if any.
      items:
        type: object
        required:
          - name
          - value
        properties:
          name:
            type: string
            description: Cookie name.
          value:
            type: string
            description: Cookie value.
          domain:
            type: string
            description: Cookie domain.
          path:
            type: string
            description: Cookie path.
          secure:
            type: boolean
            description: Whether the cookie is only sent over HTTPS.
          httpOnly:
            type: boolean
            description: Whether the cookie is inaccessible to client-side scripts.

      example:
        - name: MoodleSession
          value: abc123...
          domain: moodle.midominio.com
          path: /
          secure: true
          httpOnly: true