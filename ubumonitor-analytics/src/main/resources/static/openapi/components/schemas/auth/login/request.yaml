AuthLoginRequest:
  type: object
  required:
    - host
    - username
    - password
    - dbPassword
  properties:
    host:
      type: string
      format: uri
      description: Moodle site URL
      example: https://school.moodledemo.net
    username:
      type: string
      description: Moodle username
      example: teacher
    password:
      type: string
      format: password
      description: Moodle password
      example: moodle25
    dbPassword:
      type: string
      format: password
      description: Secret key used to encrypt the database using AES-256. This value must be kept securely and must not be stored or exposed in plain text.
      example: my-secure-encryption-key
