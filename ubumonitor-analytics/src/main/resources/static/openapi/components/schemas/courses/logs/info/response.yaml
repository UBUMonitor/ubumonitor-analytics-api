---
CourseLogsResponse:
  required:
  - "column"
  properties:
    stats:
      title: "CourseLogsImportStats"
      type: "object"
      required:
      - "saved"
      - "ignored"
      - "failed"
      properties:
        saved:
          type: "integer"
          description: "Number of logs imported"
        ignored:
          type: "integer"
          description: "Number of logs ignored (e.g. duplicates or don't have a mapper\
            \ for component, event or origin)"
        failed:
          type: "integer"
          description: "Number of logs that failed to import due to errors"
    column:
      $ref: "#/LogColumn"
LogColumn:
  title: "LogColumn"
  type: "object"
  description: "Unique value columns"
  required:
  - "components"
  - "events"
  - "componentsEvents"
  - "origins"
  properties:
    components:
      type: "array"
      items:
        $ref: "#/LogComponent"
    events:
      type: "array"
      items:
        $ref: "#/LogEvent"
    componentsEvents:
      type: "array"
      items:
        title: "LogColumnComponentsEventsInner"
        type: "object"
        required:
        - "component"
        - "event"
        properties:
          component:
            $ref: "#/LogComponent"
          event:
            $ref: "#/LogEvent"
    origins:
      type: "array"
      items:
        $ref: "#/Origin"
LogEvent:
  title: "LogEvent"
  type: "object"
  required:
  - "id"
  - "code"
  - "name"
  properties:
    id:
      type: "integer"
      format: "int64"
    code:
      type: "string"
    name:
      type: "string"
LogComponent:
  title: "LogComponent"
  type: "object"
  required:
  - "id"
  - "code"
  - "name"
  properties:
    id:
      type: "integer"
      format: "int64"
    code:
      type: "string"
    name:
      type: "string"
Origin:
  title: "Origin"
  type: "object"
  required:
  - "id"
  - "code"
  - "name"
  properties:
    id:
      type: "integer"
      format: "int64"
    code:
      type: "string"
    name:
      type: "string"
