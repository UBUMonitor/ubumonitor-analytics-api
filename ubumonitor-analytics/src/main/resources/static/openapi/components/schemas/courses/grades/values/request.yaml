CourseGradesValuesRequest:
  type: object
  required:
    - gradeItemIds
    - userIds
  properties:

    gradeItemIds:
      type: array
      minItems: 1
      items:
        type: integer
        format: int64
      description: List of grade item identifiers to include in the grade value lookup.
    userIds:
      type: array
      minItems: 1
      items:
        type: integer
        format: int64
      description: List of user identifiers to include in the grade value lookup.