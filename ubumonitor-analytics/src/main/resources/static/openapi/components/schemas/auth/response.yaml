AuthResponse:
  type: object
  required:
    - accessToken
    - tokenType
    - user
  properties:
    accessToken:
      type: string
      description: Access token for authentication
    tokenType:
      type: string
      description: Type of the token, usually "Bearer"
      example: Bearer
    user:
      $ref: '../users/me/info/response.yaml#/UserInfo'