CourseEnrollmentsResponse:
  type: object
  required:
    - users
  properties:
    users:
      type: array
      description: Users enrolled in the requested course, with their enrollment details.
      items:
        title: UserEnrollmentInfo
        type: object
        required:
          - id
          - fullName
          - email
          - imageUrl
          - roles
          - groups
          - courses
        properties:
          id:
            type: integer
            format: int64
            description: The unique identifier of the user.
          fullName:
            type: string
            description: The full name of the user.
          email:
            type: string
            description: The email address of the user.
          firstAccess:
            type: integer
            format: int64
            description: The Unix timestamp in seconds of the user's first access to the site.
          lastAccess:
            type: integer
            format: int64
            description: The Unix timestamp in seconds of the user's last access to the site.
          lastCourseAccess:
            type: integer
            format: int64
            description: Unix timestamp in seconds of the user's most recent access to the requested course.
          imageUrl:
            type: string
            format: uri
            description: The URL of the user's profile image.
          roles:
            type: array
            description: IDs of the roles assigned to this user in the requested course.
            items:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  format: int64
                  description: The unique identifier of the role.
          groups:
            type: array
            description: IDs of the groups this user belongs to in the requested course.
            items:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  format: int64
                  description: The unique identifier of the group.
          courses:
            type: array
            description: IDs of the courses this user is enrolled in.
            items:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  format: int64
                  description: The unique identifier of the course.
    roles:
      type: array
      description: Unique roles assigned to users enrolled in the requested course.
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            type: integer
            format: int64
            description: The unique identifier of the role.
          name:
            type: string
            description: Display name of the role.
    groups:
      type: array
      description: Unique groups that users belong to in the requested course.
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            type: integer
            format: int64
            description: The unique identifier of the group.
          name:
            type: string
            description: Display name of the group.
    courses:
      type: array
      description: Unique courses included in the returned users' enrollments.
      items:
        type: object
        required:
          - id
          - fullName
        properties:
          id:
            type: integer
            format: int64
            description: The unique identifier of the course.
          fullName:
            type: string
            description: The course's full display name.
