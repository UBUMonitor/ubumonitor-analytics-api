CourseContentResponse:
  type: object
  required:
    - sections
  properties:
    sections:
      type: array
      items:
        $ref: "#/CourseContentSection"



CourseContentSection:
  type: object
  properties:
    id:
      type: integer
      description: Section ID

    name:
      type: string
      description: Section name

    visible:
      type: boolean
      description: Is the section visible

    summary:
      type: string
      description: Section description

    position:
      type: integer
      description: Section number inside the course

    modules:
      type: array
      description: List of modules in the section
      items:
        $ref: "#/CourseContentModule"

  required:
    - id
    - name
    - visible
    - summary
    - position
    - modules


CourseContentModule:
  type: object
  required:
    - id
    - name
    - modName
    - url
    - description
    - visible
  properties:
    id:
      type: integer
      description: Module ID

    name:
      type: string
      description: Module name

    modName:
      type: string
      description: Module technical name

    url:
      type: string
      format: uri
      description: Module URL

    description:
      type: string
      description: Module description

    visible:
      type: boolean
      description: Is module visible
