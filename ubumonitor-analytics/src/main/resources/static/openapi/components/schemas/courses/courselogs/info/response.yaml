CourseLogsInfoResponse:
  required:
    - column
  properties:
    column:
      $ref: '#/LogColumn'

LogColumn:
  type: object
  description: Unique value columns
  required:
    - components
    - events
    - componentsEvents
  properties:
    components:
      type: array
      items:
        $ref: '#/LogComponent'
    events:
      type: array
      items:
        $ref: '#/LogEvent'
    componentsEvents:
      type: array
      items:
        type: object
        required:
          - component
          - event
        properties:
          component:
            $ref: '#/LogComponent'
          event:
            $ref: '#/LogEvent'
LogEvent:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string

LogComponent:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string