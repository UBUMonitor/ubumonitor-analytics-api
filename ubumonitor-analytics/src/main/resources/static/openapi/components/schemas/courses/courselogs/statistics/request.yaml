CourseLogsStatisticsRequest:
  type: object
  properties:

    fields:
      title: CourseLogsInfoRequestFields
      type: array
      description: Columns to include in the response and use as grouping dimensions.
      items:
        type: string
        enum:
          - USER_ID
          - MODULE_ID
          - COMPONENT_ID
          - EVENT_ID
          - ORIGIN_ID
          - IP_ADDRESS
          - USER_FULL_NAME
          - MODULE_NAME
          - COMPONENT_NAME
          - EVENT_NAME
          - ORIGIN_NAME
          - SECTION_ID
          - SECTION_NAME
    timeRange:
      type: object
      properties:
        from:
          type: integer
          format: int64
          description: Inclusive start time as a Unix timestamp in seconds.
          example: 1777593600
        to:
          type: integer
          format: int64
          description: Inclusive end time as a Unix timestamp in seconds.
          example: 1780185599

    interval:
      type: string
      description: >
        Optional time aggregation interval for grouping logs by time buckets.
        If not provided, no time-based grouping is applied.
      enum:
        - HOURLY
        - DAILY
        - WEEKLY
        - MONTHLY
        - DAY_OF_WEEK
      example: DAILY
    timeZone:
      type: string
      description: >
        IANA time zone used to compute time buckets when `interval` is set
        (e.g. Europe/Madrid). Ignored if `interval` is not provided.
      default: UTC
      example: Europe/Madrid
    filters:
      type: object
      properties:

        userIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true

        moduleIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true

        componentIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true

        eventIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true

        originIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true

        ipAddresses:
          type: array
          items:
            type: string
          nullable: true

        sectionIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
