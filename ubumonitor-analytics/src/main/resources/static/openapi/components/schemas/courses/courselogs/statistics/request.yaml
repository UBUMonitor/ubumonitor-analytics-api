CourseLogsStatisticsRequest:
  type: object
  properties:

    fields:
      title: CourseLogsInfoRequestFields
      type: array
      description: Columns to include in response
      items:
        type: string
        enum:
          - COURSE_ID
          - USER_ID
          - MODULE_ID
          - COMPONENT_ID
          - EVENT_ID
          - ORIGIN_ID
          - IP_ADDRESS
          - USER_FULL_NAME
          - MODULE_NAME
          - COMPONENT_NAME
          - EVENT_NAME
          - ORIGIN_NAME
          - SECTION_ID
          - SECTION_NAME
    timeRange:
      type: object
      properties:
        from:
          type: integer
          format: int64
          description: Inclusive start time as a Unix timestamp in seconds.
          example: 1777593600
        to:
          type: integer
          format: int64
          description: Inclusive end time as a Unix timestamp in seconds.
          example: 1780185599

    groupBy:
      type: array
      items:
        type: string
        enum:
          - USER_ID
          - MODULE_ID
          - COMPONENT_ID
          - EVENT_ID
          - ORIGIN_ID
          - IP_ADDRESS
          - SECTION_ID
    interval:
      type: string
      description: >
        Optional time aggregation interval for grouping logs by time buckets.
        If not provided, no time-based grouping is applied.
      enum:
        - HOURLY
        - DAILY
        - WEEKLY
        - MONTHLY
        - DAY_OF_WEEK
      example: DAILY
    sortBy:
      type: array
      items:
        title: CourseLogsStatisticsRequestSortByItem
        type: object
        required:
          - field
        properties:
          field:
            type: string
            enum:
              - VALUE
              - USER_ID
              - MODULE_ID
              - TIME
              - TIME_BUCKET

          direction:
            type: string
            enum: [ ASC, DESC ]
            example: ASC
            default: ASC
    filters:
      type: object
      properties:

        userIds:
          type: array
          items:
            type: integer
            format: int64
        nullable: true
        default: null

        moduleIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          default: null

        componentIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          default: null

        eventIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          default: null

        originIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          default: null

        ipAddresses:
          type: array
          items:
            type: string
          nullable: true
          default: null

        sectionIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          default: null
