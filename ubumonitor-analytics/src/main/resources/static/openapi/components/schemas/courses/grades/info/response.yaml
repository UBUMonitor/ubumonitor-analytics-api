CourseGradeItemsResponse:
  type: object
  required:
    - gradeItems
  properties:
    gradeItems:
      type: array
      items:
        type: object
        title: Grade Item
        required:
          - id
          - gradeMin
          - gradeMax
        properties:
          id:
            type: integer
            format: int64
            description: Unique identifier for the grade item
          parentId:
            type: integer
            format: int64
            description: Unique identifier for the parent grade item, if applicable
          name:
            type: string
            description: Name of the grade item
          gradeMin:
            type: number
            format: double
            description: Minimum grade value for the grade item
          gradeMax:
            type: number
            format: double
            description: Maximum grade value for the grade item
