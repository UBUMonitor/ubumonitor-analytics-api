spring:

  config:
    import: classpath:application-moodlerules.yml
  jackson:
    default-property-inclusion: non_null
    mapper:
      sort-properties-alphabetically: false
  threads:
    virtual:
      enabled: true
  devtools:
    restart:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  flyway:
    enabled: false
  http:
    clients:
      imperative:
        cookie-handling: enabled


openapi:
  uBUMonitorAnalytics:
    base-path: /api

server:
  port: 9090
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 100MB

springdoc:
  api-docs:
    enabled: false
org:
  jooq:
    Constants=OFF
jwt:
  expiration-time-in-seconds: 0

moodle:
  api:
    base-url: ${MOODLE_ADAPTER_API_BASE_URL:http://localhost:8080}
    connect-timeout: 5000
    read-timeout: 30000
  db:
    base-path: ./moodle_dbs
    jdbc-url-template: jdbc:h2:file:%s;CIPHER=AES;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;CACHE_SIZE=65536
logging:
  level:
    root: INFO
    es.ubu.lsi.moodle.utils: TRACE
    es.ubu.lsi.ubumonitoranalytics.features.auth.infrastructure.out.moodle.MoodleClientAdapter: TRACE
    es.ubu.lsi.ubumonitoranalytics.shared.infrastructure.moodle.RestClientHttpTransport: TRACE
    org.zalando.logbook: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
