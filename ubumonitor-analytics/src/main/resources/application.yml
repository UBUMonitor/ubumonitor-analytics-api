spring:
  jmx:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 5s
  jackson:
    default-property-inclusion: non_null
    mapper:
      sort-properties-alphabetically: false
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  main:
    banner-mode: off
    lazy-initialization: true
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  http:
    clients:
      imperative:
        cookie-handling: enabled

  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
openapi:
  uBUMonitorAnalytics:
    base-path: /api

server:
  address: 127.0.0.1
  port: 9090
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 100MB

springdoc:
  api-docs:
    enabled: false
moodle:
  api:
    base-url: ${MOODLE_ADAPTER_API_BASE_URL:http://localhost:8080}
    connect-timeout: 5000
    read-timeout: 30000
  db:
    base-path: ./moodle_dbs
    jdbc-url-template: jdbc:h2:file:%s;CIPHER=AES;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;CACHE_SIZE=65536
logging:
  level:
    org:
      jooq:
        Constants=OFF:
    root: INFO
