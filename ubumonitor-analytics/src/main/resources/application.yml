spring:
  jmx:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 5s
  jackson:
    default-property-inclusion: non_null
    modules-to-install: none
    mapper:
      sort-properties-alphabetically: false
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  main:
    banner-mode: off
    lazy-initialization: false
    allow-bean-definition-overriding: true
    log-startup-info: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  http:
    clients:
      imperative:
        cookie-handling: enabled

  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
openapi:
  uBUMonitorAnalytics:
    base-path: /api

server:
  address: 127.0.0.1
  port: 9090
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 100MB
    threads:
      max: 4
      min-spare: 2
    max-connections: 10
    accept-count: 5

springdoc:
  api-docs:
    enabled: false
moodle:
  api:
    base-url: ${MOODLE_ADAPTER_API_BASE_URL:http://localhost:8080}
    connect-timeout: 5000
    read-timeout: 30000
  db:
    base-path: ./moodle_dbs
    jdbc-url-template: jdbc:sqlite:%s
logging:
  level:
    org:
      jooq:
        Constants=OFF:
    root: INFO
