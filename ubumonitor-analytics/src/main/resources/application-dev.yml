springdoc:

  api-docs:
    enabled: true
    path:  /v3/api-docs
    version: openapi_3_1

  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    tags-sorter: method


logging:
  level:
    root: INFO
    org.zalando.logbook: TRACE
    org.jooq.tools.LoggerListener: DEBUG
    org.jooq: DEBUG
logbook:
  format:
    style: http

  filter:
    enabled: true

  obfuscate:
    headers:
      - Authorization
      - X-Moodle-Token
      - Cookie
    parameters:
      - password
      - token

    json-body-fields:
      - password
      - token
      - access_token
  predicate:
    exclude:
      - path: /actuator/**
      - path: /v3/api-docs/**
      - path: /swagger-ui/**
      - path: /swagger-ui.html
